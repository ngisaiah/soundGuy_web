<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0f"/>

  <!-- Top glow -->
  <radialGradient id="glow" cx="50%" cy="0%" r="60%">
    <stop offset="0%" stop-color="#7c6fff" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Dust particles — scattered in the upper glow zone -->
  <g fill="#b8b0ff">
    <circle cx="142"  cy="48"  r="1.2" opacity="0.55"/>
    <circle cx="298"  cy="82"  r="0.8" opacity="0.40"/>
    <circle cx="187"  cy="135" r="1.5" opacity="0.35"/>
    <circle cx="74"   cy="97"  r="1.0" opacity="0.50"/>
    <circle cx="401"  cy="55"  r="0.9" opacity="0.45"/>
    <circle cx="356"  cy="118" r="1.3" opacity="0.30"/>
    <circle cx="472"  cy="38"  r="0.7" opacity="0.55"/>
    <circle cx="523"  cy="96"  r="1.1" opacity="0.38"/>
    <circle cx="448"  cy="168" r="0.8" opacity="0.28"/>
    <circle cx="600"  cy="44"  r="1.4" opacity="0.50"/>
    <circle cx="638"  cy="112" r="0.9" opacity="0.42"/>
    <circle cx="558"  cy="152" r="1.2" opacity="0.25"/>
    <circle cx="712"  cy="62"  r="1.0" opacity="0.48"/>
    <circle cx="768"  cy="32"  r="0.7" opacity="0.55"/>
    <circle cx="751"  cy="138" r="1.3" opacity="0.32"/>
    <circle cx="824"  cy="86"  r="0.9" opacity="0.44"/>
    <circle cx="880"  cy="54"  r="1.5" opacity="0.38"/>
    <circle cx="856"  cy="160" r="0.8" opacity="0.26"/>
    <circle cx="936"  cy="102" r="1.1" opacity="0.40"/>
    <circle cx="982"  cy="44"  r="0.7" opacity="0.52"/>
    <circle cx="1018" cy="128" r="1.2" opacity="0.30"/>
    <circle cx="1074" cy="68"  r="1.0" opacity="0.46"/>
    <circle cx="1128" cy="92"  r="0.8" opacity="0.36"/>
    <circle cx="1096" cy="158" r="1.4" opacity="0.24"/>
    <circle cx="228"  cy="62"  r="1.0" opacity="0.42"/>
    <circle cx="318"  cy="148" r="0.7" opacity="0.30"/>
    <circle cx="662"  cy="174" r="1.1" opacity="0.22"/>
    <circle cx="912"  cy="174" r="0.9" opacity="0.28"/>
    <circle cx="48"   cy="158" r="1.3" opacity="0.32"/>
    <circle cx="1158" cy="42"  r="1.0" opacity="0.40"/>
  </g>

  <!-- Subtle wave lines -->
  <g opacity="0.12" stroke="#7c6fff" stroke-width="1.5" fill="none">
    <path d="M0 340 Q150 310 300 340 Q450 370 600 340 Q750 310 900 340 Q1050 370 1200 340"/>
    <path d="M0 390 Q150 360 300 390 Q450 420 600 390 Q750 360 900 390 Q1050 420 1200 390"/>
    <path d="M0 440 Q150 415 300 440 Q450 465 600 440 Q750 415 900 440 Q1050 465 1200 440"/>
    <path d="M0 490 Q150 468 300 490 Q450 512 600 490 Q750 468 900 490 Q1050 512 1200 490"/>
    <path d="M0 290 Q150 268 300 290 Q450 312 600 290 Q750 268 900 290 Q1050 312 1200 290"/>
  </g>

  <!-- Logo icon — centered top area -->
  <g transform="translate(514, 148)">
    <!-- Headphone arc -->
    <path d="M14 38 A58 58 0 0 1 158 38" stroke="#7c6fff" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- Left ear cup -->
    <rect x="2" y="38" width="24" height="44" rx="7" fill="#7c6fff"/>
    <!-- Right ear cup -->
    <rect x="146" y="38" width="24" height="44" rx="7" fill="#7c6fff"/>
    <!-- Mic stem -->
    <rect x="80" y="58" width="12" height="46" fill="#7c6fff"/>
    <!-- Mic head -->
    <circle cx="86" cy="52" r="22" fill="#7c6fff"/>
  </g>

  <!-- App name -->
  <text
    x="600" y="358"
    font-family="Inter, -apple-system, system-ui, sans-serif"
    font-size="72"
    font-weight="700"
    fill="#f0f0f5"
    text-anchor="middle"
    letter-spacing="-2"
  >SoundGuy</text>

  <!-- Tagline -->
  <text
    x="600" y="420"
    font-family="Inter, -apple-system, system-ui, sans-serif"
    font-size="28"
    font-weight="400"
    fill="#9898ac"
    text-anchor="middle"
    letter-spacing="0"
  >Control Logic Pro X hands-free.</text>

  <!-- Trust badges -->
  <g font-family="Inter, -apple-system, system-ui, sans-serif" font-size="20" fill="#5a5a6e" text-anchor="middle">
    <text x="390" y="510">Runs fully offline</text>
    <text x="600" y="510">·</text>
    <text x="660" y="510">No cloud processing</text>
    <text x="870" y="510">·</text>
    <text x="930" y="510">Built for macOS</text>
  </g>
</svg>
